<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Space Shooter</title>
<style>
  html,body{margin:0;height:100%;background:#05060f;color:#fff;font-family:system-ui,sans-serif;overflow:hidden}
  body{display:flex;align-items:center;justify-content:center}
  canvas{background:#0a0d24;max-width:100%;max-height:100%;touch-action:none}
</style>
</head>
<body>
<canvas id="c" width="480" height="720"></canvas>
<script>
const c = document.getElementById('c'), ctx = c.getContext('2d');
const W = c.width, H = c.height;
let player, bullets, enemies, stars, score, lives, over, t, best = +localStorage.best || 0;
const keys = {};
let pointerX = null;

function reset() {
  player = {x: W/2, y: H-70, w: 34, h: 34, cd: 0};
  bullets = []; enemies = [];
  stars = Array.from({length: 60}, () => ({x: Math.random()*W, y: Math.random()*H, s: 0.5+Math.random()*2}));
  score = 0; lives = 3; over = false; t = 0;
}
reset();

addEventListener('keydown', e => {
  keys[e.key] = true;
  if (over && (e.key === 'Enter' || e.key === ' ')) reset();
  if (e.key === ' ') e.preventDefault();
});
addEventListener('keyup', e => keys[e.key] = false);
function setPointer(e) {
  const r = c.getBoundingClientRect();
  pointerX = (e.clientX - r.left) * W / r.width;
}
c.addEventListener('pointerdown', e => { setPointer(e); if (over) reset(); });
c.addEventListener('pointermove', setPointer);
c.addEventListener('pointerup', () => pointerX = null);

function update() {
  t++;
  const sp = 5;
  if (keys.ArrowLeft || keys.a) player.x -= sp;
  if (keys.ArrowRight || keys.d) player.x += sp;
  if (pointerX !== null) player.x += Math.max(-sp*1.5, Math.min(sp*1.5, pointerX - player.x));
  player.x = Math.max(player.w/2, Math.min(W - player.w/2, player.x));

  // auto-fire (or hold space)
  if (player.cd > 0) player.cd--;
  if (player.cd === 0) {
    bullets.push({x: player.x, y: player.y - 20, r: 3});
    player.cd = 12;
  }
  bullets.forEach(b => b.y -= 9);
  bullets = bullets.filter(b => b.y > -10);

  // difficulty scales with score
  const rate = Math.max(18, 55 - Math.floor(score/100)*3);
  if (t % rate === 0) {
    enemies.push({x: 20 + Math.random()*(W-40), y: -20, r: 16, vy: 1.5 + Math.random() + score/800, hp: 1});
  }
  enemies.forEach(e => e.y += e.vy);

  for (const e of enemies) {
    for (const b of bullets) {
      if (!b.dead && Math.hypot(e.x-b.x, e.y-b.y) < e.r + b.r) { b.dead = true; e.hp--; }
    }
    if (e.hp <= 0) { e.dead = true; score += 10; }
    else if (Math.hypot(e.x-player.x, e.y-player.y) < e.r + 14) { e.dead = true; lives--; }
    else if (e.y > H + 20) { e.dead = true; lives--; }
  }
  bullets = bullets.filter(b => !b.dead);
  enemies = enemies.filter(e => !e.dead);
  if (lives <= 0) { over = true; if (score > best) { best = score; localStorage.best = best; } }

  stars.forEach(s => { s.y += s.s; if (s.y > H) { s.y = 0; s.x = Math.random()*W; } });
}

function draw() {
  ctx.clearRect(0, 0, W, H);
  ctx.fillStyle = '#fff';
  stars.forEach(s => ctx.fillRect(s.x, s.y, s.s, s.s));

  // player ship
  ctx.fillStyle = '#4fd1ff';
  ctx.beginPath();
  ctx.moveTo(player.x, player.y - 20);
  ctx.lineTo(player.x + 17, player.y + 17);
  ctx.lineTo(player.x, player.y + 8);
  ctx.lineTo(player.x - 17, player.y + 17);
  ctx.fill();

  ctx.fillStyle = '#ffe066';
  bullets.forEach(b => { ctx.beginPath(); ctx.arc(b.x, b.y, b.r, 0, 7); ctx.fill(); });

  ctx.fillStyle = '#ff5c7a';
  enemies.forEach(e => { ctx.beginPath(); ctx.arc(e.x, e.y, e.r, 0, 7); ctx.fill(); });

  ctx.fillStyle = '#fff'; ctx.font = '18px system-ui'; ctx.textAlign = 'left';
  ctx.fillText('Puntos: ' + score, 12, 26);
  ctx.textAlign = 'right';
  ctx.fillText('Vidas: ' + '♥'.repeat(Math.max(0, lives)), W-12, 26);

  if (over) {
    ctx.fillStyle = 'rgba(0,0,0,.65)'; ctx.fillRect(0, 0, W, H);
    ctx.fillStyle = '#fff'; ctx.textAlign = 'center';
    ctx.font = 'bold 40px system-ui'; ctx.fillText('GAME OVER', W/2, H/2 - 20);
    ctx.font = '20px system-ui';
    ctx.fillText('Puntos: ' + score + '  ·  Récord: ' + best, W/2, H/2 + 16);
    ctx.fillText('Enter / toque para reiniciar', W/2, H/2 + 50);
  }
}

(function loop() { if (!over) update(); draw(); requestAnimationFrame(loop); })();
</script>
</body>
</html>
