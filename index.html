<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Space Shooter</title>
<style>
  html,body{margin:0;height:100%;background:#03040c;color:#fff;font-family:system-ui,sans-serif;overflow:hidden;overscroll-behavior:none}
  body{display:flex;align-items:center;justify-content:center}
  canvas{max-width:100vw;max-height:100vh;height:100vh;aspect-ratio:2/3;touch-action:none;user-select:none;-webkit-user-select:none;display:block}
</style>
</head>
<body>
<canvas id="c" width="480" height="720"></canvas>
<script>
'use strict';
const c = document.getElementById('c'), ctx = c.getContext('2d');
const W = 480, H = 720;
const R = (a, b) => a + Math.random() * (b - a);
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const store = {
  get(k, d) { try { const v = JSON.parse(localStorage.getItem('ss_' + k)); return v ?? d; } catch { return d; } },
  set(k, v) { try { localStorage.setItem('ss_' + k, JSON.stringify(v)); } catch {} }
};

/* ---------- Audio (sintetizado, sin archivos) ---------- */
let AC = null, muted = store.get('muted', false), shootTick = 0;
function initAudio() {
  if (AC) { if (AC.state === 'suspended') AC.resume(); return; }
  try { AC = new (window.AudioContext || window.webkitAudioContext)(); } catch {}
}
function tone(f, d, type = 'square', v = .06, slide = 0) {
  if (!AC || muted) return;
  const t = AC.currentTime, o = AC.createOscillator(), g = AC.createGain();
  o.type = type; o.frequency.setValueAtTime(f, t);
  if (slide) o.frequency.exponentialRampToValueAtTime(Math.max(30, f + slide), t + d);
  g.gain.setValueAtTime(v, t); g.gain.exponentialRampToValueAtTime(.001, t + d);
  o.connect(g); g.connect(AC.destination); o.start(t); o.stop(t + d);
}
function noise(d, v = .15) {
  if (!AC || muted) return;
  const n = AC.sampleRate * d | 0, b = AC.createBuffer(1, n, AC.sampleRate), a = b.getChannelData(0);
  for (let i = 0; i < n; i++) a[i] = (Math.random() * 2 - 1) * (1 - i / n);
  const s = AC.createBufferSource(), g = AC.createGain();
  g.gain.value = v; s.buffer = b; s.connect(g); g.connect(AC.destination); s.start();
}
const SFX = {
  shoot: () => { if (++shootTick % 3 === 0) tone(880, .05, 'square', .015, -400); },
  hit: () => tone(300, .05, 'square', .03, -100),
  boom: () => { noise(.25, .12); tone(140, .25, 'sawtooth', .05, -90); },
  gem: () => tone(1200 + Math.min(combo, 30) * 25, .05, 'sine', .04),
  power: () => { tone(440, .12, 'triangle', .08, 440); },
  bomb: () => { noise(.7, .25); tone(90, .7, 'sawtooth', .1, -60); },
  hurt: () => { noise(.35, .2); tone(200, .35, 'sawtooth', .08, -150); },
  wave: () => { tone(523, .12, 'triangle', .07); setTimeout(() => tone(784, .2, 'triangle', .07), 120); },
  over: () => tone(400, .8, 'sawtooth', .08, -330),
  boss: () => tone(110, .9, 'sawtooth', .09, 40),
  graze: () => tone(1600, .02, 'sine', .012)
};

/* ---------- Estado ---------- */
let mode = 'title';           // title | play | paused | over
let player, bullets, ebullets, enemies, parts, pops, gems, powers, stars, rings;
let score, lives, wave, spawnLeft, spawnT, waveDelay, combo, comboT, maxCombo, kills, bombs;
let shake = 0, flash = 0, ts = 1, tsTarget = 1, banner = { t: 0, s: '', sub: '' }, time = 0, overT = 0;
let best = store.get('best', 0), newRecord = false, totalRuns = store.get('runs', 0);
const keys = {};
const pointer = { active: false, x: W / 2, y: H - 100 };
const BOMB_BTN = { x: W - 58, y: H - 58, r: 34 };

stars = Array.from({ length: 90 }, () => ({ x: R(0, W), y: R(0, H), v: R(.4, 3), s: R(.6, 2) }));
enemies = []; bullets = []; ebullets = []; parts = []; pops = []; gems = []; powers = []; rings = [];
combo = 0; wave = 1; score = 0; lives = 3; bombs = 2; player = { x: W / 2, y: H - 110 };

function startGame() {
  initAudio();
  player = { x: W / 2, y: H - 110, cd: 0, lvl: 1, shield: 0, inv: 90, trail: 0 };
  bullets = []; ebullets = []; enemies = []; parts = []; pops = []; gems = []; powers = []; rings = [];
  score = 0; lives = 3; bombs = 2; wave = 0; combo = 0; comboT = 0; maxCombo = 0; kills = 0;
  spawnLeft = 0; spawnT = 0; waveDelay = 40; newRecord = false; ts = tsTarget = 1; shake = 0;
  mode = 'play';
  totalRuns++; store.set('runs', totalRuns);
}

const mult = () => 1 + Math.min(7, Math.floor(combo / 6));

/* ---------- Efectos ---------- */
function burst(x, y, col, n = 14, sp = 4, life = 30) {
  for (let i = 0; i < n; i++) {
    const a = R(0, 6.283), v = R(.3, 1) * sp;
    parts.push({ x, y, vx: Math.cos(a) * v, vy: Math.sin(a) * v, life: R(.5, 1) * life, max: life, c: col, s: R(1.5, 3.5) });
  }
}
function pop(x, y, s, col = '#fff', big = false) { pops.push({ x, y, s, c: col, t: 0, big }); }
function ring(x, y, col, max = 80) { rings.push({ x, y, r: 4, max, c: col }); }
function say(s, sub = '') { banner = { t: 150, s, sub }; }

/* ---------- Enemigos ---------- */
const TYPES = {
  drone:   { r: 14, hp: 1, pts: 10, c: '#ff5c7a', gems: 1 },
  zig:     { r: 14, hp: 2, pts: 20, c: '#b388ff', gems: 1 },
  kami:    { r: 12, hp: 1, pts: 25, c: '#ff6bd6', gems: 1 },
  shooter: { r: 17, hp: 3, pts: 40, c: '#2ee6a6', gems: 2 },
  tank:    { r: 24, hp: 9, pts: 60, c: '#ff9f43', gems: 4 },
  boss:    { r: 48, hp: 60, pts: 1500, c: '#ff3b6b', gems: 30 }
};
function spawnEnemy(type, x = R(30, W - 30), y = -30) {
  const d = TYPES[type];
  const e = { type, x, y, r: d.r, hp: d.hp, max: d.hp, pts: d.pts, c: d.c, gems: d.gems, t: 0, flash: 0, bx: x, vy: 1.4 + wave * .05 };
  if (type === 'tank') e.vy = .6 + wave * .02;
  if (type === 'kami') e.vy = 2.6;
  if (type === 'shooter') { e.ty = R(70, 190); e.dir = Math.random() < .5 ? -1 : 1; }
  if (type === 'boss') { e.hp = e.max = 50 + wave * 10; e.ty = 120; e.vy = 1.2; }
  enemies.push(e);
  return e;
}
function pickType() {
  const o = ['drone', 'drone'];
  if (wave >= 2) o.push('zig', 'zig');
  if (wave >= 3) o.push('kami');
  if (wave >= 4) o.push('shooter');
  if (wave >= 5) o.push('tank');
  if (wave >= 8) o.push('shooter', 'kami', 'tank');
  return o[Math.random() * o.length | 0];
}
function nextWave() {
  wave++;
  spawnLeft = Math.min(70, 6 + wave * 3);
  spawnT = 0;
  if (wave % 5 === 0) {
    spawnLeft = Math.floor(spawnLeft / 3);
    spawnEnemy('boss', W / 2);
    say('¡JEFE!', 'Ola ' + wave); SFX.boss(); shake = 14;
  } else {
    say('OLA ' + wave, wave === 1 ? 'Disparás solo. Esquivá y recolectá.' : ''); SFX.wave();
  }
}
function ebullet(x, y, a, sp, r = 5) { ebullets.push({ x, y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp, r, g: false }); }
const aimAt = (x, y) => Math.atan2(player.y - y, player.x - x);
const bulletSpeed = () => Math.min(5.5, 2.8 + wave * .12);

function killEnemy(e) {
  e.dead = true;
  const boss = e.type === 'boss';
  burst(e.x, e.y, e.c, boss ? 90 : 16, boss ? 9 : 4.5, boss ? 60 : 30);
  burst(e.x, e.y, '#fff', boss ? 30 : 4, 3, 16);
  ring(e.x, e.y, e.c, boss ? 220 : 50);
  SFX.boom();
  kills++; combo++; comboT = 150; maxCombo = Math.max(maxCombo, combo);
  const pts = e.pts * mult();
  score += pts; pop(e.x, e.y - 10, '+' + pts, e.c, boss);
  for (let i = 0; i < e.gems; i++) gems.push({ x: e.x + R(-14, 14), y: e.y + R(-14, 14), vx: R(-2, 2), vy: R(-3, 0), r: 5 });
  if (boss) {
    ['W', 'S', 'B', 'H'].forEach((k, i) => powers.push({ k, x: e.x + (i - 1.5) * 34, y: e.y, vy: 1 }));
    ebullets.forEach(b => { b.g = true; }); ebullets.length = 0;
    tsTarget = .25; ts = .25; shake = 26; flash = 1; say('¡JEFE DERROTADO!', '+' + pts);
    setTimeout(() => tsTarget = 1, 900);
  } else if (Math.random() < .13) {
    const k = ['W', 'W', 'S', 'B', 'H'][Math.random() * 5 | 0];
    powers.push({ k, x: e.x, y: e.y, vy: 1.1 });
  }
  if (combo > 0 && combo % 10 === 0) { say('COMBO x' + combo + '!', 'Multiplicador x' + mult()); }
}

function useBomb() {
  if (mode !== 'play' || bombs <= 0) return;
  bombs--; SFX.bomb(); shake = 22; flash = .8;
  ring(player.x, player.y, '#7df', 700); ring(player.x, player.y, '#fff', 500);
  ebullets.forEach(b => { burst(b.x, b.y, '#ffd', 2, 2, 14); gems.push({ x: b.x, y: b.y, vx: 0, vy: 0, r: 3 }); });
  ebullets.length = 0;
  enemies.forEach(e => { e.hp -= e.type === 'boss' ? 12 : 30; e.flash = 8; if (e.hp <= 0 && !e.dead) killEnemy(e); });
  player.inv = Math.max(player.inv, 60);
}

function hurtPlayer() {
  const p = player;
  if (p.inv > 0) return;
  if (p.shield > 0) { p.shield = 0; p.inv = 70; ring(p.x, p.y, '#5cf', 90); SFX.hurt(); shake = 8; return; }
  lives--; p.inv = 130; p.lvl = Math.max(1, p.lvl - 1);
  combo = 0; comboT = 0; shake = 22; flash = .6; SFX.hurt();
  burst(p.x, p.y, '#4fd1ff', 30, 6, 40); ring(p.x, p.y, '#fff', 120);
  ebullets.forEach(b => { if (Math.hypot(b.x - p.x, b.y - p.y) < 130) b.dead = true; });
  if (lives <= 0) gameOver();
}
function gameOver() {
  mode = 'over'; overT = 0; SFX.over();
  burst(player.x, player.y, '#4fd1ff', 60, 8, 60); ring(player.x, player.y, '#fff', 260);
  tsTarget = .3; ts = .3; setTimeout(() => tsTarget = 1, 900);
  if (score > best) { best = score; newRecord = true; store.set('best', best); }
}

/* ---------- Actualización ---------- */
function fire() {
  const p = player, L = Math.min(5, p.lvl);
  const pat = [
    [[0, 0]],
    [[-8, 0], [8, 0]],
    [[-11, -.09], [0, 0], [11, .09]],
    [[-15, -.14], [-5, -.04], [5, .04], [15, .14]],
    [[-19, -.22], [-9, -.09], [0, 0], [9, .09], [19, .22]]
  ][L - 1];
  for (const [ox, a] of pat) bullets.push({ x: p.x + ox, y: p.y - 18, vx: Math.sin(a) * 11, vy: -Math.cos(a) * 11, r: 3 });
  p.cd = 12 - L; SFX.shoot();
}

function step() {
  time++;
  for (const s of stars) { s.y += s.v * (mode === 'play' ? 1 + Math.min(2, wave * .05) : 1); if (s.y > H) { s.y = -2; s.x = R(0, W); } }
  updateFx();
  if (mode === 'over') { overT++; return; }
  if (mode !== 'play') return;

  const p = player;
  // movimiento
  let ax = 0, ay = 0;
  if (keys.ArrowLeft || keys.a) ax--; if (keys.ArrowRight || keys.d) ax++;
  if (keys.ArrowUp || keys.w) ay--; if (keys.ArrowDown || keys.s) ay++;
  if (ax || ay) { const l = Math.hypot(ax, ay); p.x += ax / l * 5.4; p.y += ay / l * 5.4; }
  if (pointer.active) { p.x += (pointer.x - p.x) * .28; p.y += (pointer.y - 70 - p.y) * .28; }
  p.x = clamp(p.x, 18, W - 18); p.y = clamp(p.y, 60, H - 30);
  if (p.inv > 0) p.inv--;
  if (p.shield > 0 && p.shield < 1e5) { p.shield--; }
  if (--p.cd <= 0) fire();

  // olas
  if (spawnLeft > 0) {
    if (--spawnT <= 0) { spawnEnemy(pickType()); spawnLeft--; spawnT = Math.max(14, 52 - wave * 2.2) * R(.6, 1.2); }
  } else if (!enemies.length && waveDelay <= 0 && wave > 0) {
    const bonus = wave * 100; score += bonus; pop(W / 2, 200, 'OLA COMPLETADA +' + bonus, '#ffe066', true);
    waveDelay = 100;
  } else if (!enemies.length && wave === 0) waveDelay = 0;
  if (!enemies.length && spawnLeft === 0) {
    if (waveDelay > 0) { if (--waveDelay === 0) nextWave(); }
    else if (wave === 0) nextWave();
  }

  // balas del jugador
  for (const b of bullets) { b.x += b.vx; b.y += b.vy; if (b.y < -20 || b.x < -20 || b.x > W + 20) b.dead = true; }

  // enemigos
  for (const e of enemies) {
    e.t++; if (e.flash > 0) e.flash--;
    if (e.type === 'drone') e.y += e.vy;
    else if (e.type === 'zig') { e.y += e.vy; e.x = e.bx + Math.sin(e.t * .05) * 70; e.x = clamp(e.x, 20, W - 20); }
    else if (e.type === 'kami') { e.y += e.vy; e.x += clamp(p.x - e.x, -1.6, 1.6); }
    else if (e.type === 'tank') {
      e.y += e.vy;
      if (e.t % Math.max(60, 130 - wave * 4) === 0) for (let i = -1; i <= 1; i++) ebullet(e.x, e.y + 10, aimAt(e.x, e.y) + i * .28, bulletSpeed() * .85, 6);
    } else if (e.type === 'shooter') {
      if (e.y < e.ty) e.y += 2.2;
      else { e.x += e.dir * 1.4; if (e.x < 30 || e.x > W - 30) e.dir *= -1; if (e.t > 900) e.y += 2.5; }
      if (e.y >= e.ty * .8 && e.t % Math.max(45, 90 - wave * 3) === 0) ebullet(e.x, e.y + 10, aimAt(e.x, e.y), bulletSpeed());
    } else if (e.type === 'boss') {
      if (e.y < e.ty) e.y += e.vy;
      else {
        e.x = W / 2 + Math.sin(e.t * .018) * 150;
        const f = e.hp / e.max, gap = f < .35 ? 32 : 45;
        if (e.t % gap === 0) for (let i = -2; i <= 2; i++) ebullet(e.x, e.y + 30, aimAt(e.x, e.y) + i * .18, bulletSpeed() + .4);
        if (e.t % (f < .35 ? 70 : 110) === 0) {
          const n = f < .35 ? 20 : 14, off = R(0, 6.28);
          for (let i = 0; i < n; i++) ebullet(e.x, e.y, off + i / n * 6.283, bulletSpeed() * .8, 6);
        }
      }
    }
    if (e.y > H + 40) { e.dead = true; e.escaped = true; if (e.type !== 'boss') { combo = Math.max(0, combo - 3); } }
    // choque con el jugador
    if (!e.dead && Math.hypot(e.x - p.x, e.y - p.y) < e.r + 9) {
      if (e.type !== 'boss') { e.hp = 0; killEnemy(e); }
      hurtPlayer();
    }
  }
  // disparos vs enemigos
  for (const e of enemies) {
    if (e.dead) continue;
    for (const b of bullets) {
      if (b.dead) continue;
      if (Math.hypot(e.x - b.x, e.y - b.y) < e.r + b.r) {
        b.dead = true; e.hp--; e.flash = 4; SFX.hit();
        burst(b.x, b.y, '#ffe066', 2, 2, 12);
        if (e.hp <= 0) { killEnemy(e); break; }
      }
    }
  }

  // balas enemigas + graze
  for (const b of ebullets) {
    b.x += b.vx; b.y += b.vy;
    if (b.x < -30 || b.x > W + 30 || b.y < -30 || b.y > H + 30) { b.dead = true; continue; }
    const d = Math.hypot(b.x - p.x, b.y - p.y);
    if (d < b.r + 4) { b.dead = true; hurtPlayer(); }
    else if (d < 26 && !b.g && p.inv <= 0) { b.g = true; score += 5 * mult(); comboT = Math.max(comboT, 100); SFX.graze(); burst(p.x, p.y, '#9ef', 2, 2, 10); }
  }

  // gemas (imán)
  for (const g of gems) {
    const d = Math.hypot(p.x - g.x, p.y - g.y);
    if (d < 130) { g.x += (p.x - g.x) / d * 7; g.y += (p.y - g.y) / d * 7; }
    else { g.vy += .06; g.x += g.vx; g.y += g.vy; g.vx *= .97; if (g.vy > 2) g.vy = 2; }
    if (d < 20) { g.dead = true; const v = 5 * mult(); score += v; comboT = Math.max(comboT, 60); SFX.gem(); }
    if (g.y > H + 20) g.dead = true;
  }
  // power-ups
  for (const q of powers) {
    q.y += q.vy;
    if (Math.hypot(p.x - q.x, p.y - q.y) < 26) {
      q.dead = true; SFX.power(); ring(q.x, q.y, '#fff', 60);
      if (q.k === 'W') { if (p.lvl < 5) { p.lvl++; pop(q.x, q.y, 'ARMA +1', '#ffe066'); } else { score += 500; pop(q.x, q.y, '+500', '#ffe066'); } }
      if (q.k === 'S') { p.shield = 60 * 9; pop(q.x, q.y, 'ESCUDO', '#5cf'); }
      if (q.k === 'B') { if (bombs < 5) bombs++; pop(q.x, q.y, 'BOMBA', '#ff9f43'); }
      if (q.k === 'H') { if (lives < 5) lives++; else score += 500; pop(q.x, q.y, 'VIDA +1', '#ff5c7a'); }
    }
    if (q.y > H + 20) q.dead = true;
  }

  if (comboT > 0 && --comboT === 0) combo = 0;

  bullets = bullets.filter(b => !b.dead);
  ebullets = ebullets.filter(b => !b.dead);
  enemies = enemies.filter(e => !e.dead);
  gems = gems.filter(g => !g.dead);
  powers = powers.filter(q => !q.dead);
}

function updateFx() {
  for (const q of parts) { q.x += q.vx; q.y += q.vy; q.vx *= .96; q.vy *= .96; q.life--; }
  parts = parts.filter(q => q.life > 0);
  for (const q of pops) { q.t++; q.y -= .6; }
  pops = pops.filter(q => q.t < 60);
  for (const r of rings) r.r += (r.max - r.r) * .14 + 1.5;
  rings = rings.filter(r => r.r < r.max - 1);
  if (banner.t > 0) banner.t--;
  shake *= .9; if (shake < .3) shake = 0;
  flash *= .88;
  ts += (tsTarget - ts) * .08;
}

/* ---------- Dibujo ---------- */
function txt(s, x, y, size = 18, col = '#fff', align = 'left', bold = false) {
  ctx.font = (bold ? 'bold ' : '') + size + 'px system-ui,sans-serif'; ctx.textAlign = align; ctx.fillStyle = col; ctx.fillText(s, x, y);
}
function heart(x, y, s, col) {
  ctx.fillStyle = col; ctx.beginPath();
  ctx.moveTo(x, y + s * .35); ctx.bezierCurveTo(x - s, y - s * .5, x - s * .2, y - s, x, y - s * .3);
  ctx.bezierCurveTo(x + s * .2, y - s, x + s, y - s * .5, x, y + s * .35); ctx.fill();
}

function drawEnemy(e) {
  ctx.save(); ctx.translate(e.x, e.y);
  const f = e.flash > 0;
  ctx.fillStyle = f ? '#fff' : e.c;
  if (e.type === 'drone') {
    ctx.beginPath(); ctx.moveTo(0, e.r); ctx.lineTo(-e.r, -e.r * .7); ctx.lineTo(0, -e.r * .3); ctx.lineTo(e.r, -e.r * .7); ctx.fill();
  } else if (e.type === 'zig') {
    ctx.beginPath(); for (let i = 0; i < 6; i++) { const a = i / 6 * 6.283 + e.t * .05; ctx.lineTo(Math.cos(a) * e.r, Math.sin(a) * e.r); } ctx.fill();
  } else if (e.type === 'kami') {
    ctx.rotate(Math.atan2(player.y - e.y, player.x - e.x) - Math.PI / 2);
    ctx.beginPath(); ctx.moveTo(0, e.r * 1.4); ctx.lineTo(-e.r, -e.r); ctx.lineTo(e.r, -e.r); ctx.fill();
  } else if (e.type === 'shooter') {
    ctx.fillRect(-e.r, -e.r * .5, e.r * 2, e.r); ctx.fillRect(-e.r * .4, -e.r, e.r * .8, e.r * 2);
    ctx.fillStyle = '#012'; ctx.fillRect(-3, -3, 6, 6);
  } else if (e.type === 'tank') {
    ctx.beginPath(); for (let i = 0; i < 8; i++) { const a = i / 8 * 6.283 + .39; ctx.lineTo(Math.cos(a) * e.r, Math.sin(a) * e.r); } ctx.fill();
    ctx.fillStyle = f ? '#fff' : '#7a3d00'; ctx.beginPath(); ctx.arc(0, 0, e.r * .5, 0, 7); ctx.fill();
  } else if (e.type === 'boss') {
    ctx.beginPath(); for (let i = 0; i < 6; i++) { const a = i / 6 * 6.283 + Math.PI / 6; ctx.lineTo(Math.cos(a) * e.r, Math.sin(a) * e.r * .8); } ctx.fill();
    ctx.fillStyle = f ? '#fff' : '#3b0012'; ctx.beginPath(); ctx.arc(0, 0, e.r * .5, 0, 7); ctx.fill();
    ctx.fillStyle = '#ff3b6b'; ctx.beginPath(); ctx.arc(Math.sin(e.t * .05) * 6, 0, e.r * .22, 0, 7); ctx.fill();
  }
  if (e.max > 3 && e.type !== 'boss' && e.hp < e.max) {
    ctx.fillStyle = '#000a'; ctx.fillRect(-e.r, -e.r - 9, e.r * 2, 4);
    ctx.fillStyle = '#fff'; ctx.fillRect(-e.r, -e.r - 9, e.r * 2 * e.hp / e.max, 4);
  }
  ctx.restore();
}

function drawShip() {
  const p = player;
  if (p.inv > 0 && (p.inv >> 2) % 2 && mode === 'play') return;
  ctx.save(); ctx.translate(p.x, p.y);
  const fl = 8 + Math.random() * 8;
  ctx.fillStyle = '#ff9f43'; ctx.beginPath(); ctx.moveTo(-6, 12); ctx.lineTo(0, 12 + fl); ctx.lineTo(6, 12); ctx.fill();
  ctx.fillStyle = '#ffe066'; ctx.beginPath(); ctx.moveTo(-3, 12); ctx.lineTo(0, 12 + fl * .6); ctx.lineTo(3, 12); ctx.fill();
  ctx.fillStyle = '#4fd1ff'; ctx.beginPath(); ctx.moveTo(0, -22); ctx.lineTo(17, 17); ctx.lineTo(0, 9); ctx.lineTo(-17, 17); ctx.fill();
  ctx.fillStyle = '#c9f1ff'; ctx.beginPath(); ctx.moveTo(0, -14); ctx.lineTo(5, 4); ctx.lineTo(-5, 4); ctx.fill();
  if (p.shield > 0) {
    const a = p.shield < 120 ? (p.shield >> 3) % 2 ? .25 : .7 : .7;
    ctx.strokeStyle = 'rgba(90,200,255,' + a + ')'; ctx.lineWidth = 2.5; ctx.beginPath(); ctx.arc(0, 0, 28, 0, 7); ctx.stroke();
  }
  ctx.restore();
  // hitbox visible
  ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.arc(p.x, p.y, 3, 0, 7); ctx.fill();
}

function draw() {
  const hue = (wave * 37) % 360;
  const g = ctx.createLinearGradient(0, 0, 0, H);
  g.addColorStop(0, `hsl(${hue},55%,7%)`); g.addColorStop(1, `hsl(${(hue + 40) % 360},60%,14%)`);
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
  ctx.save();
  if (shake > 0) ctx.translate(R(-shake, shake), R(-shake, shake));

  for (const s of stars) { ctx.fillStyle = `rgba(255,255,255,${.25 + s.v / 4.5})`; ctx.fillRect(s.x, s.y, s.s, s.s * (1 + s.v)); }

  for (const g of gems) { ctx.fillStyle = '#6ff'; ctx.save(); ctx.translate(g.x, g.y); ctx.rotate(.785); ctx.fillRect(-g.r * .7, -g.r * .7, g.r * 1.4, g.r * 1.4); ctx.restore(); }
  for (const q of powers) {
    const col = { W: '#ffe066', S: '#5cf', B: '#ff9f43', H: '#ff5c7a' }[q.k];
    ctx.strokeStyle = col; ctx.lineWidth = 2.5; ctx.fillStyle = '#0008';
    ctx.beginPath(); ctx.arc(q.x, q.y, 13 + Math.sin(time * .15) * 1.5, 0, 7); ctx.fill(); ctx.stroke();
    txt(q.k, q.x, q.y + 5, 14, col, 'center', true);
  }
  enemies.forEach(drawEnemy);

  ctx.fillStyle = '#ffe066';
  for (const b of bullets) { ctx.beginPath(); ctx.arc(b.x, b.y, b.r, 0, 7); ctx.fill(); }
  for (const b of ebullets) {
    ctx.fillStyle = '#ff3b6b'; ctx.beginPath(); ctx.arc(b.x, b.y, b.r + 1, 0, 7); ctx.fill();
    ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.arc(b.x, b.y, b.r - 2, 0, 7); ctx.fill();
  }
  if (mode !== 'title' && !(mode === 'over')) drawShip();

  ctx.globalCompositeOperation = 'lighter';
  for (const q of parts) { ctx.globalAlpha = q.life / q.max; ctx.fillStyle = q.c; ctx.fillRect(q.x, q.y, q.s, q.s); }
  ctx.globalAlpha = 1;
  for (const r of rings) { ctx.strokeStyle = r.c; ctx.globalAlpha = 1 - r.r / r.max; ctx.lineWidth = 3; ctx.beginPath(); ctx.arc(r.x, r.y, r.r, 0, 7); ctx.stroke(); }
  ctx.globalAlpha = 1; ctx.globalCompositeOperation = 'source-over';

  for (const q of pops) {
    ctx.globalAlpha = 1 - q.t / 60; txt(q.s, q.x, q.y, q.big ? 26 : 15, q.c, 'center', true);
  }
  ctx.globalAlpha = 1;
  ctx.restore();

  if (flash > .02) { ctx.fillStyle = `rgba(255,255,255,${flash * .6})`; ctx.fillRect(0, 0, W, H); }

  if (mode === 'play' || mode === 'paused' || mode === 'over') drawHUD();
  if (banner.t > 0 && mode === 'play') {
    const a = Math.min(1, banner.t / 30, (150 - banner.t) / 15 + .2);
    ctx.globalAlpha = clamp(a, 0, 1);
    txt(banner.s, W / 2, 300, 44, '#fff', 'center', true);
    if (banner.sub) txt(banner.sub, W / 2, 335, 18, '#cde', 'center');
    ctx.globalAlpha = 1;
  }
  if (mode === 'title') drawTitle();
  if (mode === 'paused') {
    ctx.fillStyle = '#000b'; ctx.fillRect(0, 0, W, H);
    txt('PAUSA', W / 2, H / 2 - 10, 46, '#fff', 'center', true);
    txt('P / Esc / toque para seguir', W / 2, H / 2 + 26, 18, '#bcd', 'center');
  }
  if (mode === 'over') drawOver();
}

function drawHUD() {
  txt(String(score).padStart(7, '0'), 12, 28, 24, '#fff', 'left', true);
  txt('MEJOR ' + Math.max(best, score), 12, 48, 13, '#8ab');
  txt('OLA ' + wave, W / 2, 26, 16, '#cde', 'center', true);
  for (let i = 0; i < lives; i++) heart(W - 20 - i * 24, 24, 10, '#ff5c7a');
  // nivel de arma
  for (let i = 0; i < 5; i++) { ctx.fillStyle = i < player.lvl ? '#ffe066' : '#ffffff22'; ctx.fillRect(W - 122 + i * 22 - 0, 44, 18, 5); }
  // combo
  if (combo >= 2) {
    const m = mult();
    txt('x' + m, W / 2, 62, 22, m >= 5 ? '#ff9f43' : '#ffe066', 'center', true);
    txt(combo + ' combo', W / 2, 80, 12, '#bcd', 'center');
    ctx.fillStyle = '#ffffff22'; ctx.fillRect(W / 2 - 50, 86, 100, 4);
    ctx.fillStyle = '#ffe066'; ctx.fillRect(W / 2 - 50, 86, 100 * comboT / 150, 4);
  }
  // boss hp
  const bs = enemies.find(e => e.type === 'boss');
  if (bs) {
    ctx.fillStyle = '#0008'; ctx.fillRect(60, 100, W - 120, 8);
    ctx.fillStyle = '#ff3b6b'; ctx.fillRect(60, 100, (W - 120) * clamp(bs.hp / bs.max, 0, 1), 8);
  }
  // botón bomba
  const B = BOMB_BTN, ok = bombs > 0;
  ctx.globalAlpha = ok ? .9 : .35;
  ctx.fillStyle = '#0009'; ctx.strokeStyle = '#ff9f43'; ctx.lineWidth = 3;
  ctx.beginPath(); ctx.arc(B.x, B.y, B.r, 0, 7); ctx.fill(); ctx.stroke();
  txt('💣', B.x, B.y + 3, 22, '#fff', 'center');
  txt('x' + bombs, B.x, B.y + 24, 14, '#ffd', 'center', true);
  ctx.globalAlpha = 1;
  if (muted) txt('🔇', 14, H - 14, 16, '#fff');
}

function drawTitle() {
  ctx.fillStyle = '#0006'; ctx.fillRect(0, 0, W, H);
  ctx.save(); ctx.translate(0, Math.sin(time * .04) * 6);
  txt('SPACE', W / 2, 220, 68, '#4fd1ff', 'center', true);
  txt('SHOOTER', W / 2, 285, 68, '#ff5c7a', 'center', true);
  ctx.restore();
  if (best > 0) txt('Récord: ' + best, W / 2, 335, 20, '#ffe066', 'center', true);
  if ((time >> 5) % 2) txt('TOCÁ o presioná ENTER para jugar', W / 2, 420, 20, '#fff', 'center', true);
  const L = ['Mové: flechas / WASD / arrastrá el dedo', 'Bomba: ESPACIO o botón 💣', 'Pausa: P    Sonido: M',
    'Recolectá gemas, encadená combos,', 'rozá las balas (graze) y vencé a los jefes.',
    'W arma · S escudo · B bomba · H vida'];
  L.forEach((s, i) => txt(s, W / 2, 500 + i * 24, 15, '#9bb', 'center'));
}

function drawOver() {
  const a = Math.min(1, overT / 40);
  ctx.fillStyle = `rgba(0,0,0,${.7 * a})`; ctx.fillRect(0, 0, W, H);
  if (overT < 30) return;
  txt('GAME OVER', W / 2, 250, 48, '#ff5c7a', 'center', true);
  txt(String(score), W / 2, 305, 40, '#fff', 'center', true);
  if (newRecord) txt('¡NUEVO RÉCORD!', W / 2, 340, 22, '#ffe066', 'center', true);
  else txt('Récord: ' + best, W / 2, 340, 18, '#9bb', 'center');
  txt(`Ola ${wave}  ·  ${kills} enemigos  ·  combo máx. ${maxCombo}`, W / 2, 380, 16, '#cde', 'center');
  if (overT > 50 && (time >> 5) % 2) txt('ENTER / toque para reintentar', W / 2, 450, 20, '#fff', 'center', true);
}

/* ---------- Entrada ---------- */
addEventListener('keydown', e => {
  initAudio();
  const k = e.key.length === 1 ? e.key.toLowerCase() : e.key;
  keys[k] = true;
  if ([' ', 'ArrowLeft', 'ArrowRight', 'ArrowUp', 'ArrowDown'].includes(e.key)) e.preventDefault();
  if (mode === 'title' && (k === 'Enter' || k === ' ')) startGame();
  else if (mode === 'over' && overT > 50 && (k === 'Enter' || k === ' ')) startGame();
  else if (mode === 'play' && (k === ' ' || k === 'b' || k === 'Shift')) useBomb();
  if ((k === 'p' || k === 'Escape') && (mode === 'play' || mode === 'paused')) mode = mode === 'play' ? 'paused' : 'play';
  if (k === 'm') { muted = !muted; store.set('muted', muted); }
});
addEventListener('keyup', e => { keys[e.key.length === 1 ? e.key.toLowerCase() : e.key] = false; });
addEventListener('blur', () => { if (mode === 'play') mode = 'paused'; for (const k in keys) keys[k] = false; });

function toGame(e) { const r = c.getBoundingClientRect(); return { x: (e.clientX - r.left) * W / r.width, y: (e.clientY - r.top) * H / r.height }; }
c.addEventListener('pointerdown', e => {
  initAudio(); c.setPointerCapture(e.pointerId);
  const p = toGame(e);
  if (mode === 'title') return startGame();
  if (mode === 'over') { if (overT > 50) startGame(); return; }
  if (mode === 'paused') { mode = 'play'; return; }
  if (Math.hypot(p.x - BOMB_BTN.x, p.y - BOMB_BTN.y) < BOMB_BTN.r + 10) return useBomb();
  pointer.active = true; pointer.x = p.x; pointer.y = p.y;
});
c.addEventListener('pointermove', e => { if (pointer.active) { const p = toGame(e); pointer.x = p.x; pointer.y = p.y; } });
const release = () => { pointer.active = false; };
c.addEventListener('pointerup', release); c.addEventListener('pointercancel', release);

/* ---------- Bucle (paso fijo a 60 Hz, independiente de la pantalla) ---------- */
let last = performance.now(), acc = 0;
function frame(now) {
  const dt = Math.min(.05, (now - last) / 1000); last = now;
  if (mode !== 'paused') {
    acc += dt * 60 * ts;
    let n = 0;
    while (acc >= 1 && n++ < 5) { step(); acc--; }
    if (n >= 5) acc = 0;
  }
  draw();
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);

// gancho de depuración: agregar #debug a la URL
if (location.hash === '#debug') window.__dbg = () => ({ mode, score, wave, lives, combo, kills, bombs, enemies: enemies.length, lvl: player.lvl, boss: enemies.some(e => e.type === 'boss'), ts });
if (location.hash === '#debug') window.__jump = n => { wave = n - 1; enemies = []; spawnLeft = 0; waveDelay = 1; };
</script>
